spring:
  application:
    name: main-service
  activemq:
    broker-url: ${ACTIVEMQ_BROKER_URL:tcp://localhost:61616}
    user: ${ACTIVEMQ_CONNECTION_USER:system}
    password: ${ACTIVEMQ_CONNECTION_PASSWORD:manager}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${application.security.accessToken.issuer}

server:
  port: 8082

application:
  security:
    defaultPasswordLength: 10
    userBlock:
      maxLoginAttempts: 3
      durationSeconds: 300
    accessToken:
      issuer: http://main-service:8082
      lifetimeSeconds: 600
      publicKey: ${JWT_PUBLIC_KEY_PATH:file:/etc/keys/public.pem}
      privateKey: ${JWT_PRIVATE_KEY_PATH:/etc/keys/private.pem}
      keyId: ${JWT_KEY_ID:key-1}
    refreshToken:
      lifetimeSeconds: 864000
      lengthBytes: 32
    interserviceToken:
      lifetimeSeconds: 1800
    cors:
      allowedOrigins: []
logging:
  pattern:
    level: "%5p [%X{transactionId}]"

management:
  metrics:
    tags:
      application: ${spring.application.name}

eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka-server:8761/eureka
  instance:
    preferIpAddress: true
