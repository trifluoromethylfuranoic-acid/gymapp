logging:
  threshold:
    console: trace
  level:
    root: info
    com.epam.lenda: trace

spring:
  datasource:
    url: jdbc:h2:mem:gymapp-dev
    driver-class-name: org.h2.Driver
    username: admin
    password: 1111

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    defer-datasource-initialization: true

  sql:
    init:
      data-locations: classpath:data-init/data.sql

  h2:
    console:
      enabled: true
      path: /h2-console

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  endpoint:
    health:
      show-details: always
      show-components: always
  health:
    key:
      enabled: db,diskspace

application:
  security:
    accessToken:
      lifetimeSeconds: 60000
