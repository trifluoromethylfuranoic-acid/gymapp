logging:
  threshold:
    console: info
  level:
    root: info
    com.epam.lenda: info

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/gymapp
    driver-class-name: org.postgresql.Driver
    username: gymapp
    password: ${POSTGRES_PASSWORD}

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
      roles: ADMIN
  health:
    key:
      enabled: db,diskspace
