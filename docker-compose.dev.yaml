services:
  main-service:
    depends_on:
      - postgres
    environment:
      - SPRING_PROFILES_ACTIVE=dev

  postgres:
    image: postgres:18.6
    environment:
      - POSTGRES_DB=gymapp
      - POSTGRES_USER=gymapp
    env_file:
      - ./main-service/.env
    ports:
      - 5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
    ports:
      - 9090:9090
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --web.enable-lifecycle

volumes:
  postgres-data:
    name: gymapp-postgres-data
